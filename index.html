<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HST - Contato Analisador</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      background-color: #000000;
      color: #f8fafc;
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      /* Troque '332889.jpg' pelo link direto da imagem se não for subir a foto no repositório */
      background-image:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05) 0%,
          rgba(0, 0, 0, 0.25) 70%,
          rgba(0, 0, 0, 0.88) 89%,
          rgba(0, 0, 0, 0.99) 100%
        ),
        url("332889.jpg");
      background-position: center top;
      background-repeat: no-repeat;
      background-size: cover;
      padding: 24px 18px 34px;
    }

    .bottom-cta-wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
      z-index: 5;
    }

    .btn-open {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 15px 22px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.45);
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn-open:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-open:active {
      transform: scale(0.99);
    }

    /* Fica escondido até o usuário clicar no botão */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      background: rgba(24, 29, 38, 0.96);
      border: 1px solid rgba(59, 130, 246, 0.45);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.75);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }

    .btn-close:hover {
      color: #ffffff;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #e2e8f0;
    }

    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f131a;
      color: #f8fafc;
      font-size: 14px;
    }

    select:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-top: 18px;
    }

    .btn-cancel {
      flex: 1;
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-cancel:hover {
      background: #475569;
    }

    .btn-send {
      flex: 1;
      background: #16a34a;
      color: #ffffff;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-send:hover {
      background: #15803d;
    }

    .feedback {
      margin-top: 12px;
      font-size: 13px;
      color: #86efac;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="bottom-cta-wrap">
    <button type="button" class="btn-open" id="openModalBtn">
      Enviar mensagem para email do analisador
    </button>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Detalhes para o analisador</h2>
        <button type="button" class="btn-close" id="closeModalBtn" aria-label="Fechar">&times;</button>
      </div>

      <form id="analyzerForm">
        <div class="field">
          <label for="setorSelect">Em qual setor você quer ficar?</label>
          <select id="setorSelect" required>
            <option value="">Selecione um setor</option>
            <option value="Procurar clientes">Procurar clientes</option>
            <option value="Espalhar QR codes">Espalhar QR codes</option>
            <option value="Vender os scripts">Vender os scripts</option>
            <option value="Testar os scripts">Testar os scripts</option>
          </select>
        </div>

        <div class="field">
          <label for="motivoInput">Por que você vai ficar lá?</label>
          <textarea
            id="motivoInput"
            placeholder="Explique o motivo de querer ficar nesse setor..."
            required
          ></textarea>
        </div>

        <div class="actions">
          <button type="button" class="btn-cancel" id="cancelBtn">Cancelar</button>
          <button type="submit" class="btn-send">Enviar</button>
        </div>

        <div class="feedback" id="feedbackMsg"></div>
      </form>
    </div>
  </div>

  <script>
    const ANALYZER_EMAIL = "victoralveslula@gmail.com";

    const openModalBtn = document.getElementById("openModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const analyzerForm = document.getElementById("analyzerForm");
    const setorSelect = document.getElementById("setorSelect");
    const motivoInput = document.getElementById("motivoInput");
    const feedbackMsg = document.getElementById("feedbackMsg");

    function openModal() {
      feedbackMsg.textContent = "";
      modalBackdrop.classList.add("active");
      modalBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modalBackdrop.classList.remove("active");
      modalBackdrop.setAttribute("aria-hidden", "true");
    }

    openModalBtn.addEventListener("click", openModal);
    closeModalBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);

    modalBackdrop.addEventListener("click", (event) => {
      if (event.target === modalBackdrop) {
        closeModal();
      }
    });

    analyzerForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const setorEscolhido = setorSelect.value.trim();
      const motivo = motivoInput.value.trim();

      if (!setorEscolhido || !motivo) {
        feedbackMsg.style.color = "#fca5a5";
        feedbackMsg.textContent = "Preencha o setor e o motivo antes de enviar.";
        return;
      }

      const subject = encodeURIComponent(`Solicitação de Setor: ${setorEscolhido}`);
      const body = encodeURIComponent(
        `Setor desejado: ${setorEscolhido}\n\nPor que vai ficar lá:\n${motivo}`
      );

      feedbackMsg.style.color = "#86efac";
      feedbackMsg.textContent = "Abrindo seu aplicativo de e-mail para enviar...";

      window.location.href = `mailto:${ANALYZER_EMAIL}?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
